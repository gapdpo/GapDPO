[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-db"
version = "0.1.0"
description = "Multi-agent synthetic deepvoice phishing scenario dataset generator for defensive research."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
madb-generate = "madb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

